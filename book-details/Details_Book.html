<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Details</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="header"></div>
    <main class="container book-detail-page">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="../home/Home.html">Home</a><span>/</span
        ><a href="../catalog/book_Catelog.html">Catalog</a><span>/</span
        ><span aria-current="page" data-book-breadcrumb>Book details</span>
      </nav>
      <article class="book-detail card">
        <div
          class="book-detail__cover book-cover--olive"
          aria-label="Book cover placeholder"
        >
          <span data-book-cover-initials>Book</span>
        </div>
        <div class="book-detail__content">
          <div class="book-meta">
            <span class="badge" data-book-availability></span
            ><span class="book-meta__category" data-book-category></span>
          </div>
          <h1 class="page-title" data-book-title>Book details</h1>
          <p class="book-detail__author" data-book-author></p>
          <p class="book-detail__description" data-book-description></p>
          <dl class="book-facts">
            <div>
              <dt>ISBN</dt>
              <dd data-book-isbn></dd>
            </div>
            <div>
              <dt>Published</dt>
              <dd data-book-year></dd>
            </div>
            <div>
              <dt>Total copies</dt>
              <dd data-book-total-copies></dd>
            </div>
            <div>
              <dt>Available</dt>
              <dd data-book-available-copies></dd>
            </div>
          </dl>
          <div class="book-detail__actions" data-book-actions hidden>
            <button class="button button--primary" type="button" id="btnBorrowbook" data-borrow-book>
              Borrow book
            </button>
          </div>
        </div>
      </article>
      <section class="related-section">
        <header class="section-heading">
          <div>
            <p class="section-label">Keep exploring</p>
            <h2>Related titles</h2>
          </div>
        </header>
        <div id="related-books" class="related-grid" aria-live="polite">
          <p class="book-detail__description">Loading related titles...</p>
        </div>
      </section>
    </main>
    <div id="footer"></div>
    <script type="module" src="../js/layout.js"></script>
    <script type="module" src="../js/book-details.js"></script>
  </body>
</html>
