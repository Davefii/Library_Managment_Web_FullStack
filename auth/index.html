<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Access Your Account</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-panel" aria-labelledby="login-title">
        <a class="brand" href="../home/index.html">Library Online</a>
        <div class="auth-card">
          <p class="section-label">Member access</p>
          <h1 id="login-title">Access your account</h1>
          <p class="auth-copy">
            Sign in to reserve books, review your borrowing history, and manage
            your library profile.
          </p>
          <form id="login-form" class="auth-form">
            <div class="form-field">
              <label for="email">Email address</label
              ><input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
                placeholder="you@example.com"
              />
            </div>
            <div class="form-field">
              <div class="field-row">
                <label for="password">Password</label
                ><a href="#">Forgot password?</a>
              </div>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                placeholder="Enter your password"
              />
            </div>
            <button class="button button--primary button--full" type="submit">
              Sign in
            </button>
          </form>
          <p class="auth-switch">
            New to the library? <a href="#">Create an account</a>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
