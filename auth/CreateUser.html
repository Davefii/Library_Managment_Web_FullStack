<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Your Account</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-panel" aria-labelledby="signup-title">
        <a class="brand" href="../home/index.html">Library Online</a>
        <div class="auth-card">
          <p class="section-label">Member registration</p>
          <h1 id="signup-title">Create your account</h1>
          <p class="auth-copy">
            Join the library to reserve books, review your borrowing history,
            and manage your profile.
          </p>
          <form id="signup-form" class="auth-form">
            <div class="form-field">
              <label for="signup-email">Email address</label>
              <input
                id="signup-email"
                name="email"
                type="email"
                autocomplete="email"
                required
                placeholder="you@example.com"
              />
            </div>
            <div class="form-field">
              <label for="signup-full-name">Full name</label>
              <input
                id="signup-full-name"
                name="fullName"
                type="text"
                autocomplete="name"
                required
                placeholder="Your full name"
              />
            </div>
            <div class="form-field">
              <label for="signup-phone-number">Phone number</label>
              <input
                id="signup-phone-number"
                name="phoneNumber"
                type="tel"
                autocomplete="tel"
                required
                placeholder="Your phone number"
              />
            </div>
            <div class="form-field">
              <label for="signup-address">Address</label>
              <input
                id="signup-address"
                name="address"
                type="text"
                autocomplete="street-address"
                required
                placeholder="Your address"
              />
            </div>
            <div class="form-field">
              <label for="signup-password">Password</label>
              <input
                id="signup-password"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
                placeholder="At least 8 characters"
              />
            </div>
            <div class="form-field">
              <label for="confirm-password">Confirm password</label>
              <input
                id="confirm-password"
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
                placeholder="Repeat your password"
              />
            </div>
            <button class="button button--primary button--full" type="submit">
              Create account
            </button>
          </form>
          <p class="auth-switch">
            Already have an account?
            <a href="Login.html">Sign in</a>
          </p>
        </div>
      </section>
    </main>
    <script type="module" src="ScriptCreateUser.js"></script>
  </body>
</html>
