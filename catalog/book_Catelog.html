<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browse Catalog</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="header"></div>
    <main>
      <section class="catalog-hero">
        <div class="container">
          <p class="section-label">Library catalog</p>
          <h1 class="page-title">Browse the collection.</h1>
          <p class="page-subtitle">
            Search the catalog and filter by category or availability.
          </p>
        </div>
      </section>
      <section class="container catalog-layout">
        <aside class="filter-panel card" aria-label="Catalog filters">
          <div class="filter-panel__header">
            <h2>Filters</h2>
            <button class="text-button" type="button">Reset</button>
          </div>
          <fieldset>
            <legend>Category</legend>
            <label><input type="checkbox" /> Programming</label
            ><label><input type="checkbox" /> Architecture</label
            ><label><input type="checkbox" /> Design</label
            ><label><input type="checkbox" /> History</label>
          </fieldset>
          <fieldset>
            <legend>Availability</legend>
            <label
              ><input type="radio" name="availability" checked /> All
              books</label
            ><label
              ><input type="radio" name="availability" /> Available now</label
            >
          </fieldset>
        </aside>
        <section class="catalog-results" aria-labelledby="catalog-heading">
          <header class="results-toolbar">
            <div>
              <h2 id="catalog-heading">Available titles</h2>
              <p>12 results</p>
            </div>
            <div class="toolbar-actions">
              <div class="search-field">
                <span class="search-field__icon">⌕</span
                ><input type="search" placeholder="Search books" />
              </div>
              <select aria-label="Sort books">
                <option>Recently added</option>
                <option>Title A–Z</option>
                <option>Most borrowed</option>
              </select>
            </div>
          </header>
          <div id="catalog-grid" class="catalog-grid"></div>
        </section>
      </section>
    </main>
    <div id="footer"></div>
    <script type="module" src="../js/layout.js"></script>
    <script type="module" src="../js/catalog-books.js"></script>
  </body>
</html>
