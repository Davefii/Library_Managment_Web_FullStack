<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Audit Logs | Library Online</title>
    <link rel="stylesheet" href="../admin-pages.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div class="page-title">
          <h1>Audit Logs</h1>
          <p>Read-only security and activity history.</p>
        </div>
        <div class="header-actions"></div>
      </header>
      <section class="card">
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>User</th>
                <th>Action</th>
                <th>Entity</th>
                <th>Details</th>
              </tr>
            </thead>
            <tbody id="auditLogsTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="ScriptAuditLogs.js"></script>
  </body>
</html>
