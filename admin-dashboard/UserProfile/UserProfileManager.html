<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Profiles | Library Online</title>
    <link rel="stylesheet" href="../admin-pages.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div class="page-title">
          <h1>User Profiles</h1>
          <p>Manage application user profiles.</p>
        </div>
        <div class="header-actions">
          <button class="button button--primary" id="create-user-profile-button" type="button">
            + Add User Profile
          </button>
        </div>
      </header>

      <section class="card">
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>User Email</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Phone Number</th>
                <th>Address</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="user-profiles-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="UserProfileListManager.js"></script>
  </body>
</html>
