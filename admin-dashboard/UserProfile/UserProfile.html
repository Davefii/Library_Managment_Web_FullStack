<!doctype html>
<html lang="en">
<head>

    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">
    <title>Users Profile | Library Online</title>
    <link
        rel="stylesheet"
        href="../admin-pages.css">
</head>
<body>
<main class="page-shell">
    <header class="page-header">
        <div class="page-title">
            <h1>My Profile</h1>
            <p>
                View and manage your account information.
            </p>
        </div>
    </header>
    <section class="card form-card">
        <form id="profileForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="userId">
                        User ID
                    </label>
                    <input
                        class="input"
                        id="userId"
                        type="text"
                        readonly>

                </div>
                <div class="form-group">
                    <label for="email">
                        Email
                    </label>
                    <input
                        class="input"
                        id="email"
                        type="email"
                        readonly>
                </div>
                <div class="form-group">
                    <label for="role">
                        Role
                    </label>
                    <input
                        class="input"
                        id="role"
                        type="text"
                        readonly>

                </div>
                <div class="form-group">
                    <label for="status">
                        Account Status
                    </label>
                    <input
                        class="input"
                        id="status"
                        type="text"
                        readonly>

                </div>
                <div class="form-group">
                    <label for="createdAt">
                        Created At
                    </label>
                    <input
                        class="input"
                        id="createdAt"
                        type="text"
                        readonly>
                </div>
                <div class="form-group">
                    <label for="lastLogin">
                        Last Login
                    </label>
                    <input
                        class="input"
                        id="lastLogin"
                        type="text"
                        readonly>
                </div>
            </div>
        </form>
    </section>
    <section class="card form-card" style="margin-top: 20px;">
        <header class="page-title">
            <h2>Security</h2>
            <p>
                Manage your account security.
            </p>
        </header>
        <div class="form-actions">
            <button
                class="button"
                id="changePasswordButton"
                type="button">
                Change Password
            </button>
            <button
                class="button button--danger"
                id="logoutButton"
                type="button">
                Logout
            </button>
        </div>
    </section>
</main>
</body>
</html>
