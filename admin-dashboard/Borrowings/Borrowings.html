<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Borrowings | Library Online</title>
    <link rel="stylesheet" href="../admin-pages.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div class="page-title">
          <h1>Borrowings</h1>
          <p>Manage library borrowing activity.</p>
        </div>
        <div class="header-actions">
          <button
            class="button button--primary"
            id="createBorrowingButton"
            type="button"
          >
            + Create Borrowing
          </button>
        </div>
      </header>
      <section class="card toolbar">
        <div class="search-box">
          <input
            class="input"
            id="searchInput"
            type="search"
            placeholder="Search borrowing"
          />
          <button
            class="button button--primary"
            id="Searchbtn"
            type="button"
          >
            Search Borrowing
          </button>
        </div>
        <div class="toolbar-actions">
          <select class="select" id="Bywhat">
            <option value="Name">Name</option>
            <option value="UserName">UserName</option>
            <option value="BookTitle">BookTitle</option>
          </select>
          <select class="select" id="statusFilter">
            <option value="">All statuses</option>
            <option value="Active">Active</option>
            <option value="Returned">Returned</option>
            <option value="Overdue">Overdue</option>
          </select>
        </div>
      </section>
      <section class="card">
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Member Name</th>
                <th>User Email</th>
                <th>Book</th>
                <th>Borrowed Date</th>
                <th>Due Date</th>
                <th>Returned Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="borrowingsTableBody"></tbody>
          </table>
        </div>
        <!--<footer class="pagination">
          <span id="itemsCount"> 0 items </span>
          <div class="pagination-actions">
            <button
              class="button button--small"
              id="previousButton"
              type="button"
            >
              Previous
            </button>
            <button class="button button--small" id="nextButton" type="button">
              Next
            </button>
          </div>
        </footer>-->
      </section>
    </main>
    <script type="module" src="ScriptBorrowingsListManager.js"></script>
  </body>
</html>
