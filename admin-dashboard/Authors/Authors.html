<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Authors | Library Online</title>
    <link rel="stylesheet" href="../admin-pages.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div class="page-title">
          <h1>Authors</h1>
          <p>Create, read, update, and delete authors.</p>
        </div>
        <div class="header-actions">
          <button
            class="button button--primary"
            id="createButton"
            type="button"
          >
            + Add Author
          </button>
        </div>
      </header>
      <section class="card">
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Author Name</th>
                <th>Nationality</th>
                <th>Birth Date</th>
                <th>Biography</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="authorsTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="ScriptAuthors.js"></script>
  </body>
</html>
