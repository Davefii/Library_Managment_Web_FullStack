<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Author Form | Library Online</title>
    <link rel="stylesheet" href="../admin-pages.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="card form-card">
        <header class="page-title">
          <h1>Author</h1>
          <p>Create or edit author.</p>
        </header>
        <form class="form-grid" id="authorForm">
          <div class="form-group">
            <label for="firstName">First name</label
            ><input class="input" id="firstName" type="text" required />
          </div>
          <div class="form-group">
            <label for="lastName">Last name</label
            ><input class="input" id="lastName" type="text" required />
          </div>
          <div class="form-group">
            <label for="nationality">Nationality</label
            ><input class="input" id="nationality" type="text" />
          </div>
          <div class="form-group">
            <label for="birthDate">Birth date</label
            ><input class="input" id="birthDate" type="date" />
          </div>
          <div class="form-group form-group--full">
            <label for="biography">Biography</label
            ><textarea class="textarea" id="biography" rows="5"></textarea>
          </div>
          <div class="form-group">
            <label for="imageAuthor">Author image</label>
            <input class="input" type="file" id="imageAuthor" accept="image/*">
          </div>
          <div class="form-actions form-group--full">
            <button class="button" type="button">Cancel</button
            ><button class="button button--primary" type="submit">
              Save Author
            </button>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="ScriptAddOrUpdateAuthors.js"></script>
  </body>
</html>
