<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Members | Library Online</title>
    <link rel="stylesheet" href="../admin-pages.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div class="page-title">
          <h1>Members</h1>
          <p>List members.</p>
        </div>
        <div class="header-actions">
          <button
            class="button button--primary"
            id="create-member-button"
            type="button"
          >
            + Add Member
          </button>
        </div>
      </header>
      <section class="card toolbar">
        <div class="search-box">
          <input
            class="input"
            id="searchInput"
            type="search"
            placeholder="Search members..."
          />
          <select class="select" id="Bywhat">
            <option value="Name">Name</option>
            <option value="UserName">UserEmail</option>
          </select>
          <button
            class="button button--primary"
            id="Search-member-button"
            type="button"
          >
            Search
          </button>
        </div>
      </section>
      <section class="card">
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>Member Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Status</th>
                <th>Membership Expiry Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="membersTableBody"></tbody>
          </table>
        </div>
        <!--<footer class="pagination">
          <span id="itemsCount">0 items</span>
          <div class="pagination-actions">
            <button class="button button--small" type="button">Previous</button
            ><button class="button button--small" type="button">Next</button>
          </div>
        </footer>-->
      </section>
    </main>
    <script type="module" src="ScriptLoadMembers.js"></script>
  </body>
</html>
