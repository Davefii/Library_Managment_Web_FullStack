<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Book Form | Library Online</title>
    <link rel="stylesheet" href="../admin-pages.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="card form-card">
        <header class="page-title">
          <h1>Book</h1>
          <p id="formTitle">Create or edit book.</p>
        </header>
        <form class="form-grid" id="bookForm" enctype="multipart/form-data">
          <div class="form-group">
            <label for="title">Title</label
            ><input class="input" id="title" type="text" />
          </div>
          <div class="form-group">
            <label for="isbn">ISBN</label
            ><input class="input" id="isbn" type="text" />
          </div>
          <div class="form-group">
            <label for="publishYear">Publish year</label>
            <input class="input" id="publishYear" type="number" />
          </div>
          <div class="form-group">
            <label for="authorId">Author</label
            ><select class="select" id="authorId">
              <option value="">-- Select a Author --</option>
            </select>
          </div>
          <div class="form-group">
            <label for="categoryId">Category</label
            ><select class="select" id="categoryId">
              <option value="">-- Select a Category --</option>
            </select>
          </div>
          <div class="form-group">
            <label for="copies">TotalCopies</label>
            <input class="input" id="copies" type="number" />
          </div>
          <div class="form-group">
            <label for="availableCopies">Available copies</label>
            <input class="input" id="availableCopies" type="number" />
          </div>
          <div class="form-group">
            <label for="isAvailable">Availability</label>
            <input id="isAvailable" type="checkbox" />
          </div>
          <div class="form-group form-group--full">
            <label for="description">Description</label
            ><textarea class="textarea" id="description" rows="5"></textarea>
          </div>
          <div class="form-group form-group--full">
              <label for="imagePath">Cover image</label>
              <img style="width: 40%;object-fit: cover;" src="" alt="Book_Image" srcset="" id="DisplayImage">
              <input id="imagePath" name="coverImage" class="input" type="file" accept="image/*">
          </div>
          <div class="form-actions form-group--full">
            <button class="button" type="button" id="btnClose">Cancel</button
            ><button class="button button--primary" id="btnSave" type="submit">
              Save Book
            </button>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="ScriptBookAddOrUpdate.js"></script>
  </body>
</html>
