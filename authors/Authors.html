<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Authors Directory</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="header"></div>
    <main>
      <section class="page-intro">
        <div class="container">
          <p class="section-label">People behind the books</p>
          <h1 class="page-title">Authors Directory</h1>
          <p class="page-subtitle">
            Explore authors represented in the library collection.
          </p>
          <div class="directory-search search-field">
            <span class="search-field__icon">⌕</span
            ><input type="search" placeholder="Search authors..." />
          </div>
        </div>
      </section>
      <section id="author-grid" class="container author-grid" aria-live="polite">
        <p class="page-subtitle">Loading authors...</p>
      </section>
    </main>
    <div id="footer"></div>
    <script type="module" src="../js/layout.js"></script>
    <script type="module" src="../js/authors-page.js"></script>
  </body>
</html>
