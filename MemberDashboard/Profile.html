<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>My Profile | Member Dashboard</title><link rel="stylesheet" href="MemberDashboard.css" /></head>
  <body>
    <main class="dashboard">
      <section class="section profile-section">
        <div class="section-heading"><div><p class="eyebrow">MY PROFILE</p><h1>Personal information</h1></div><button class="button button--primary" id="editProfileButton" type="button">Edit information</button></div>
        <div class="profile-card">
          <div class="profile-row"><span>Full name</span><strong id="profileName">--</strong></div>
          <div class="profile-row"><span>Email</span><strong id="profileEmail">--</strong></div>
          <div class="profile-row"><span>Phone</span><strong id="profilePhone">--</strong></div>
          <div class="profile-row"><span>Address</span><strong id="profileAddress">--</strong></div>
        </div>
      </section>
    </main>
    <script type="module" src="Profile.js"></script>
  </body>
</html>
